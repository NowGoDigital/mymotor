<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --red:#E60012; --red-dark:#9d000b; --red-glow:#ff4d55;
  --black:#0a0a0a; --dark:#141414; --panel:#1b1b1b;
  --gray:#9ca3af; --light:#f6f6f4; --white:#fff;
  --serif:'Playfair Display',serif;
  --sans:'Montserrat',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans)}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--black);overflow-x:hidden;max-width:100vw}
img{max-width:100%}

/* ============ PRELOADER ============ */
.preloader{position:fixed;inset:0;background:var(--black);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity .8s ease,visibility .8s}
.preloader.hide{opacity:0;visibility:hidden}
.pl-logo{width:80px;height:60px;background:linear-gradient(135deg,var(--red),var(--red-dark));
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:34px;
  animation:plPulse 1.4s ease infinite;box-shadow:0 0 40px rgba(230,0,18,.5)}
@keyframes plPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pl-bar{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.pl-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--red-glow),#fff);
  animation:plSlide 1.2s ease infinite}
@keyframes plSlide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
.pl-text{color:var(--red-glow);font-size:11px;letter-spacing:6px;text-transform:uppercase;font-weight:700;text-align:center}

/* ============ NAVBAR ============ */
.navbar{position:fixed;top:0;left:0;width:100%;z-index:1200;
  padding:18px 6%;display:flex;align-items:center;justify-content:space-between;
  transition:.45s ease}
.navbar.scrolled{background:rgba(10,10,10,.94);backdrop-filter:blur(16px);
  padding:12px 6%;border-bottom:1px solid rgba(230,0,18,.4);
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-badge{width:46px;height:36px;min-width:46px;background:linear-gradient(135deg,var(--red),var(--red-dark));
  border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:900;font-size:19px;box-shadow:0 0 18px rgba(230,0,18,.55)}
.logo-text{color:#fff;font-weight:800;font-size:19px;letter-spacing:3px;white-space:nowrap}
.logo-text span{color:var(--red-glow)}
.logo-sub{display:block;font-size:8px;letter-spacing:4px;color:var(--gray);font-weight:600;white-space:nowrap}
.nav-links{display:flex;gap:30px;list-style:none;align-items:center}
.nav-links a{color:#e5e5e5;text-decoration:none;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:2px;transition:.3s;position:relative}
.nav-links a:not(.nav-cta)::after{content:'';position:absolute;bottom:-6px;left:0;width:0;height:2px;
  background:linear-gradient(90deg,var(--red-glow),#fff);transition:.35s}
.nav-links a:not(.nav-cta):hover::after{width:100%}
.nav-links a:not(.nav-cta):hover{color:var(--red-glow)}
.nav-cta{background:linear-gradient(135deg,var(--red-glow),var(--red),var(--red-dark));color:#fff!important;
  padding:12px 26px;border-radius:50px;font-weight:800!important;
  box-shadow:0 4px 18px rgba(230,0,18,.45);transition:.3s}
.nav-cta:hover{transform:translateY(-2px)}

.hamburger{display:none;color:var(--red-glow);font-size:20px;cursor:pointer;
  width:46px;height:46px;z-index:1201;border-radius:14px;
  background:rgba(230,0,18,.08);border:1px solid rgba(230,0,18,.5);
  backdrop-filter:blur(8px);transition:.35s;
  align-items:center;justify-content:center}
.hamburger:active{transform:scale(.92)}
.navbar.scrolled .hamburger{background:rgba(230,0,18,.14);box-shadow:0 4px 16px rgba(230,0,18,.25)}

.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);
  z-index:1100;opacity:0;visibility:hidden;transition:.45s}
.nav-overlay.show{opacity:1;visibility:visible}

/* ============ HERO ============ */
.hero{position:relative;height:100vh;height:100svh;min-height:600px;overflow:hidden;background:var(--black)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;
  display:flex;align-items:center;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}

.slide-bg{position:absolute;inset:0;transform:scale(1.12);
  background-repeat:no-repeat;background-size:cover,cover,cover}
.slide.active .slide-bg{animation:kenburns 6.5s ease forwards}
@keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1)}}
/* GARIS KECEPATAN RACING */
.slide-bg::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,
    transparent 0 110px, rgba(255,255,255,.05) 110px 112px,
    transparent 112px 220px, rgba(230,0,18,.12) 220px 224px)}

.slide::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.18) 100%)}
.slide::before{content:'';position:absolute;bottom:0;left:0;right:0;height:200px;z-index:1;
  background:linear-gradient(transparent,rgba(10,10,10,.9))}

.hero-content{position:relative;z-index:5;max-width:1320px;width:100%;margin:0 auto;
  padding:100px 6% 120px;color:#fff}
.hero-content > *{opacity:0;transform:translateY(38px)}
.slide.active .hero-content > *{animation:fadeUp .9s cubic-bezier(.19,1,.22,1) forwards}
.slide.active .hero-content > *:nth-child(1){animation-delay:.25s}
.slide.active .hero-content > *:nth-child(2){animation-delay:.4s}
.slide.active .hero-content > *:nth-child(3){animation-delay:.55s}
.slide.active .hero-content > *:nth-child(4){animation-delay:.7s}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.hero-tag{display:inline-flex;align-items:center;gap:10px;
  background:rgba(230,0,18,.12);border:1px solid rgba(230,0,18,.6);backdrop-filter:blur(8px);
  color:#ffd7d7;padding:10px 26px;border-radius:50px;font-size:11px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;margin-bottom:26px;max-width:100%}
.hero-tag i{font-size:9px;color:var(--red-glow)}
.hero-title{font-size:clamp(34px,6vw,76px);font-weight:900;line-height:1.08;margin-bottom:20px;
  text-shadow:0 6px 40px rgba(0,0,0,.7)}
.hero-title .line2{display:block;font-family:var(--serif);font-style:italic;font-weight:700;
  background:linear-gradient(120deg,#ffffff,var(--red-glow),#ffd7d7,var(--red-glow));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% auto;animation:redShine 4s linear infinite}
@keyframes redShine{to{background-position:200% center}}
.hero-desc{font-size:clamp(14px,1.5vw,17px);color:#cbd5e1;max-width:560px;margin-bottom:38px;
  line-height:1.85;font-weight:300}
.hero-btns{display:flex;gap:18px;flex-wrap:wrap}

.btn{padding:17px 40px;border-radius:50px;font-weight:800;font-size:13px;text-decoration:none;
  text-transform:uppercase;letter-spacing:2px;transition:.4s cubic-bezier(.19,1,.22,1);
  display:inline-flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  border:none;position:relative;overflow:hidden;text-align:center}
.btn-red{background:linear-gradient(135deg,var(--red-glow),var(--red),var(--red-dark));color:#fff;
  box-shadow:0 10px 30px rgba(230,0,18,.45)}
.btn-red:hover{transform:translateY(-4px)}
.btn-carbon{background:linear-gradient(135deg,#2c2c2c,#111);color:#fff;
  border:1px solid rgba(230,0,18,.65);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.btn-carbon:hover{transform:translateY(-4px);border-color:var(--red-glow)}
.btn-ghost{background:rgba(255,255,255,.05);color:#fff;border:1.5px solid rgba(255,255,255,.35);
  backdrop-filter:blur(8px)}
.btn-ghost:hover{border-color:var(--red-glow);color:var(--red-glow)}
.btn::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-25deg);transition:.6s}
.btn:hover::after{left:130%}

.hero-side{position:absolute;right:6%;bottom:120px;z-index:6;display:flex;flex-direction:column;
  gap:16px;align-items:flex-end}
.hero-side .v-line{width:1px;height:70px;background:linear-gradient(rgba(230,0,18,0),var(--red-glow))}
.slide-counter{color:#fff;font-weight:800;font-size:14px;letter-spacing:3px;
  text-shadow:0 2px 14px rgba(0,0,0,.8)}
.slide-counter b{color:var(--red-glow);font-size:30px;font-family:var(--serif)}
.hero-dots{position:absolute;bottom:44px;left:6%;display:flex;gap:16px;z-index:10}
.dot{width:56px;height:4px;background:rgba(255,255,255,.22);border-radius:4px;cursor:pointer;
  position:relative;overflow:hidden;transition:.3s}
.dot.active::after{content:'';position:absolute;left:0;top:0;height:100%;width:0;
  background:linear-gradient(90deg,var(--red-glow),#fff);border-radius:4px;
  animation:dProgress 6s linear forwards}
@keyframes dProgress{to{width:100%}}
.scroll-hint{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:6;
  color:rgba(255,255,255,.5);font-size:10px;letter-spacing:4px;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint .mouse{width:22px;height:36px;border:2px solid rgba(255,255,255,.4);border-radius:12px;position:relative}
.scroll-hint .mouse::after{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:3px;height:7px;background:var(--red-glow);border-radius:3px;animation:scrollDot 1.8s infinite}
@keyframes scrollDot{0%{opacity:1;top:6px}100%{opacity:0;top:18px}}

/* ============ STATS BAR ============ */
.stats-bar{background:linear-gradient(135deg,var(--black),var(--panel));padding:0 6%;
  border-bottom:1px solid rgba(230,0,18,.3)}
.stats-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  gap:20px;padding:44px 0}
.stat{text-align:center;position:relative}
.stat:not(:last-child)::after{content:'';position:absolute;right:-10px;top:15%;height:70%;width:1px;
  background:linear-gradient(rgba(230,0,18,0),rgba(230,0,18,.5),rgba(230,0,18,0))}
.stat .num{font-size:clamp(28px,3.4vw,44px);font-weight:900;font-family:var(--serif);
  background:linear-gradient(120deg,#ffffff,var(--red-glow));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .lbl{color:var(--gray);font-size:11px;letter-spacing:3px;text-transform:uppercase;
  font-weight:600;margin-top:8px}

/* ============ SECTION ============ */
section{padding:110px 6%}
.section-head{text-align:center;max-width:680px;margin:0 auto 74px}
.section-sub{display:inline-flex;align-items:center;gap:14px;color:var(--red);font-size:12px;
  font-weight:800;letter-spacing:5px;text-transform:uppercase;margin-bottom:18px;text-align:center}
.section-sub::before,.section-sub::after{content:'';width:36px;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--red))}
.section-sub::after{background:linear-gradient(90deg,var(--red),transparent)}
.section-title{font-size:clamp(26px,4vw,46px);font-weight:900;line-height:1.25;margin-bottom:20px;
  overflow-wrap:break-word}
.section-title .serif{font-family:var(--serif);font-style:italic;font-weight:700;color:var(--red-dark)}
.section-desc{color:var(--gray);font-size:15px;line-height:1.85;font-weight:400}

.reveal{opacity:0;transform:translateY(46px);transition:opacity .9s cubic-bezier(.19,1,.22,1),
  transform .9s cubic-bezier(.19,1,.22,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:.12s}.reveal-d2{transition-delay:.24s}.reveal-d3{transition-delay:.36s}

/* ============ PRODUK ============ */
.products{background:var(--light);position:relative;overflow:hidden}
.products::before{content:'HONDA';position:absolute;top:40px;left:50%;transform:translateX(-50%);
  font-size:clamp(70px,14vw,190px);font-weight:900;color:rgba(0,0,0,.03);letter-spacing:20px;
  white-space:nowrap;pointer-events:none}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;max-width:1320px;margin:0 auto;position:relative;z-index:2}
.card{background:#fff;border-radius:24px;overflow:hidden;transition:.5s cubic-bezier(.19,1,.22,1);
  box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #ececec;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;z-index:3;
  background:linear-gradient(90deg,var(--red),#fff,var(--red));
  transform:scaleX(0);transition:.5s;transform-origin:left}
.card:hover::before{transform:scaleX(1)}
.card:hover{transform:translateY(-16px);box-shadow:0 30px 60px rgba(0,0,0,.16)}
.card-img{height:210px;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.7s}
.card:hover .card-img img{transform:scale(1.09)}
.car-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:15px;gap:10px;letter-spacing:2px;text-align:center;padding:0 16px}
.car-ph i{font-size:52px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
.ph-red{background:radial-gradient(circle at 30% 25%,#ff5a5a,#8f0008 75%)}
.ph-black{background:radial-gradient(circle at 30% 25%,#3d3d3d,#101010 72%)}
.ph-silver{background:radial-gradient(circle at 30% 25%,#ffffff,#9aa1a7 80%);color:#333}
.ph-blue{background:radial-gradient(circle at 30% 25%,#6db3e8,#0c2f4d 78%)}
.card-ribbon{position:absolute;top:16px;left:16px;background:rgba(10,10,10,.85);backdrop-filter:blur(8px);
  border:1px solid rgba(230,0,18,.6);color:#ffd7d7;padding:8px 18px;border-radius:50px;
  font-size:10px;font-weight:800;letter-spacing:2px;z-index:2;text-transform:uppercase}
.card-body{padding:30px 26px}
.card-cat{font-size:10px;color:var(--gray);font-weight:700;letter-spacing:3px;text-transform:uppercase}
.card-title{font-size:22px;font-weight:900;margin:8px 0 6px}
.card-price{color:var(--red);font-weight:800;font-size:16px;margin-bottom:18px}
.card-price small{color:var(--gray);font-weight:500;font-size:12px}
.card-specs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.spec{background:var(--light);border:1px solid #e8e8e8;border-radius:10px;padding:9px 14px;
  font-size:11px;color:#4b5563;font-weight:700;display:flex;align-items:center;gap:7px;transition:.3s}
.spec i{color:var(--red);font-size:12px}
.card-btns{display:flex;gap:12px}
.card-btns .btn{flex:1;padding:15px 10px;font-size:11px;letter-spacing:1px}
.note-price{text-align:center;color:var(--gray);font-size:12px;margin-top:36px;max-width:1320px;margin-left:auto;margin-right:auto}

/* ============ MARQUEE ============ */
.marquee{background:var(--black);padding:24px 0;overflow:hidden;
  border-top:1px solid rgba(230,0,18,.35);border-bottom:1px solid rgba(230,0,18,.35)}
.marquee-track{display:flex;gap:60px;white-space:nowrap;animation:marquee 22s linear infinite;width:max-content}
.marquee-track span{color:rgba(255,255,255,.85);font-size:14px;font-weight:800;letter-spacing:4px;
  text-transform:uppercase;display:flex;align-items:center;gap:60px}
.marquee-track span i{color:var(--red-glow);font-size:10px}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ============ LAYANAN (BARU — RACING CARBON) ============ */
.services{background:var(--black);color:#fff;position:relative;overflow:hidden}
.services::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.services .section-sub{color:var(--red-glow)}
.services .section-sub::before{background:linear-gradient(90deg,transparent,var(--red-glow))}
.services .section-sub::after{background:linear-gradient(90deg,var(--red-glow),transparent)}
.services .section-desc{color:#9ca3af}
.svc-grid{max-width:1320px;margin:0 auto;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;position:relative;z-index:2}
.svc{background:linear-gradient(165deg,#181818,#101010);border:1px solid rgba(230,0,18,.28);
  border-radius:20px;padding:36px 28px;position:relative;overflow:hidden;
  transition:.5s cubic-bezier(.19,1,.22,1)}
.svc::before{content:'';position:absolute;top:-45%;right:-45%;width:90%;height:90%;
  background:radial-gradient(circle,rgba(230,0,18,.20),transparent 62%);transition:.5s}
.svc:hover{transform:translateY(-10px);border-color:var(--red-glow);
  box-shadow:0 24px 60px rgba(230,0,18,.22)}
.svc i{font-size:34px;color:var(--red-glow);margin-bottom:20px;display:inline-block;
  filter:drop-shadow(0 0 14px rgba(255,77,85,.55))}
.svc h3{font-size:16px;font-weight:800;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
.svc p{color:#9ca3af;font-size:13px;line-height:1.75;font-weight:300}

/* ============ SALES ============ */
.sales{background:radial-gradient(ellipse at 20% 20%,#2c0507 0%,var(--black) 55%);
  color:#fff;position:relative;overflow:hidden}
.sales .deco-ring{position:absolute;border-radius:50%;border:1px solid rgba(230,0,18,.16);pointer-events:none}
.ring1{width:560px;height:560px;top:-220px;right:-180px}
.ring2{width:380px;height:380px;bottom:-160px;left:-120px}
.ring3{width:240px;height:240px;top:30%;left:44%;border-color:rgba(230,0,18,.09)}
.sales-box{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:370px 1fr;
  gap:70px;align-items:center;position:relative;z-index:2}
.sales-photo{position:relative}
.sales-photo .frame{border-radius:24px;overflow:hidden;aspect-ratio:3/4;background:#181818;
  position:relative;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.frame::before{content:'';position:absolute;inset:0;border-radius:24px;padding:3px;z-index:3;
  background:linear-gradient(150deg,var(--red-glow),transparent 40%,transparent 60%,var(--red));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.sales-photo img{width:100%;height:100%;object-fit:cover}
.photo-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;color:#555;background:linear-gradient(160deg,#242424,#151515);padding:10px}
.photo-ph i{font-size:80px}
.photo-ph span{font-size:11px;font-weight:700;letter-spacing:3px;text-align:center}
.sales-badge-float{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--red-glow),var(--red),var(--red-dark));color:#fff;
  padding:12px 24px;border-radius:50px;font-size:10.5px;font-weight:900;white-space:nowrap;
  letter-spacing:1.5px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;max-width:94%}
.sales-info .section-sub{color:var(--red-glow);justify-content:flex-start}
.sales-info .section-sub::before{display:none}

/* ===== LOAD CONTENT ===== */
async function loadContent(){
  let data=null;
  const wantDraft=new URLSearchParams(location.search).has('draft');
  if(wantDraft){try{const raw=localStorage.getItem('hm_draft');if(raw)data=JSON.parse(raw);}catch(e){}}
  if(!data){try{const r=await fetch('content.json?v='+Date.now(),{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}}
  C=clone(DEFAULT_CONTENT);
  if(data)deepMerge(C,data);
  renderAll();
}

/* ===== INIT INTERAKSI ===== */
function initAll(){
  const navLinks=$('#navLinks'),navOverlay=$('#navOverlay'),hamburger=$('#hamburger'),hamIcon=$('#hamIcon');
  function toggleMenu(forceClose){
    const isOpen=navLinks.classList.contains('open');
    const shouldClose=forceClose===true||isOpen;
    navLinks.classList.toggle('open',!shouldClose);
    navOverlay.classList.toggle('show',!shouldClose);
    document.body.classList.toggle('menu-open',!shouldClose);
    hamIcon.className=shouldClose?'fas fa-bars':'fas fa-times';
    document.body.style.overflow=shouldClose?'':'hidden';
  }
  hamburger.addEventListener('click',()=>toggleMenu());
  navOverlay.addEventListener('click',()=>toggleMenu(true));
  navLinks.addEventListener('click',e=>{if(e.target.closest('a'))toggleMenu(true);});

  window.current=0;let timer;
  const slides=()=>$$('.slide'),dots=()=>$$('.dot');
  window.goSlide=function(i){
    const S=slides(),D=dots();if(!S.length)return;
    S[window.current]?.classList.remove('active');D[window.current]?.classList.remove('active');
    window.current=(i+S.length)%S.length;
    S[window.current].classList.add('active');
    const d=D[window.current];if(d){d.classList.remove('active');void d.offsetWidth;d.classList.add('active');}
    $('#slideNum').textContent=String(window.current+1).padStart(2,'0');
    resetTimer();
  };
  function resetTimer(){clearInterval(timer);timer=setInterval(()=>goSlide((window.current+1)%slides().length),6000);}
  resetTimer();
  $('#heroDots').addEventListener('click',e=>{const d=e.target.closest('.dot');if(d)goSlide(+d.dataset.i);});

  let touchX=0;
  $('#hero').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});
  $('#hero').addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchX;
    if(Math.abs(dx)>50)goSlide(dx<0?(window.current+1)%slides().length:(window.current-1+slides().length)%slides().length);
  },{passive:true});

  window.addEventListener('scroll',()=>{
    $('#navbar').classList.toggle('scrolled',window.scrollY>60);
    $('#toTop').classList.toggle('show',window.scrollY>500);
  },{passive:true});

  const observer=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}});},{threshold:0.12});
  $$('.reveal').forEach(el=>observer.observe(el));

  const counterObs=new IntersectionObserver(es=>{es.forEach(e=>{
    if(!e.isIntersecting)return;
    const el=e.target,target=+el.dataset.count,start=performance.now();
    (function tick(now){
      const p=Math.min((now-start)/2000,1),eased=1-Math.pow(1-p,3);
      el.textContent=Math.round(eased*target).toLocaleString('id-ID');
      if(p<1)requestAnimationFrame(tick);
      else el.textContent=target.toLocaleString('id-ID')+(target>=1000?'+':'');
    })(start);
    counterObs.unobserve(el);
  });},{threshold:0.6});
  $$('[data-count]').forEach(el=>counterObs.observe(el));
}

loadContent().then(initAll);
window.addEventListener('load',()=>{setTimeout(()=>$('#preloader').classList.add('hide'),800);});
